_target_: tdlp.architectures.tdlp.core.build_mm_tdsp_model
mm_dim: 256
similarity_prediction_head_hidden_dim: 128
similarity_head_type: mlp

sph_common_params:
  hidden_dim: 128
sph_per_feature_params:
  bbox:
    hidden_dim: 128

common_params:
  hidden_dim: 128
  dropout: 0.1
  track_encoder_n_heads: 8
  track_encoder_n_layers: 2
  track_encoder_ffn_dim: 512
  projector_intermediate_dim: 128
  interaction_encoder_enable: true
  interaction_encoder_n_heads: 8
  interaction_encoder_n_layers: 2
  interaction_encoder_ffn_dim: 512
per_feature_params:
  bbox:
    feature_encoder_type: motion
    feature_encoder_params:
      input_dim: 5

aggregator_type: sum
aggregator_params: {}
