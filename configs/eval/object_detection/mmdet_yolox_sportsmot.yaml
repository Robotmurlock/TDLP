type: 'mmdet_yolox'
params:
  accelerator: cuda:0
  conf: 0.1
  min_bbox_area: 100
  # mmdetection config matching ByteTrack YOLOX-X architecture
  model_config: /work/configs/mmdet/yolox_x_bytetrack.py
  # Model source: https://github.com/ifzhang/ByteTrack, ByteTrack_ablation
  model_path: /media/home/models/detection/sportsmot.pth.tar
  bytetrack_compat: true
lookup_path: /media/home/models/detection/sportsmot.lookup.json
oracle: false
cache_path: '/workspace/motrack/sportsmot_mmdet_yolox'  # Inference on the second run is 10-20 times faster
